server:
  port: ${PORT:8080}

spring:
  application:
    name: english
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/english_notes}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    tags-sorter: alpha
    operations-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://www.mylearningeng.me,https://mylearningeng.me,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.mylearningeng.me,https://*.vercel.app}
  encryption:
    secret-key: ${APP_ENCRYPTION_KEY:ThisIsA32CharDevSecretKey12345!!}
  ai:
    provider: ${APP_AI_PROVIDER:${AI_PROVIDER:gemini}}
    allowed-base-urls:
      - "http://localhost:20128/v1"
      - "https://api.deepseek.com"
      - "https://generativelanguage.googleapis.com"
      - "https://api.openai.com"
  gemini:
    api-url: ${APP_GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:${APP_GEMINI_API_KEY:}}
  openai:
    api-url: ${APP_OPENAI_API_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:${DEEPSEEK_API_KEY:${APP_OPENAI_API_KEY:}}}

